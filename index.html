    // 効果音再生用（Web Audio API）
    const playQuizSound = (isCorrect) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') {
          ctx.resume();
        }
        const now = ctx.currentTime;

        if (isCorrect) {
          // ピンポン（正解音）
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(659.25, now); // ミ (E5)
          gain1.gain.setValueAtTime(0.3, now);
          gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.15);

          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(880, now + 0.15); // ラ (A5)
          gain2.gain.setValueAtTime(0.35, now + 0.15);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(now + 0.15);
          osc2.stop(now + 0.6);
        } else {
          // ブブー（不正解音）
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = 'sawtooth';
          osc1.frequency.setValueAtTime(150, now);
          gain1.gain.setValueAtTime(0.3, now);
          gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.2);

          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'sawtooth';
          osc2.frequency.setValueAtTime(140, now + 0.25);
          gain2.gain.setValueAtTime(0.3, now + 0.25);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(now + 0.25);
          osc2.stop(now + 0.55);
        }
      } catch (e) {
        console.warn("効果音再生エラー:", e);
      }
    };

    // カタカナをひらがなに正規化するヘルパー関数
    const toHiragana = (str) => {
      if (!str) return "";
      return str.replace(/[\u30a1-\u30f6]/g, m => String.fromCharCode(m.charCodeAt(0) - 0x60));
    };

    // 県庁所在地の柔軟な正解判定（市・区・町の有無や、東京/新宿の両方に対応）
    const checkCapitalAnswer = (input, target) => {
      if (!input || !target) return false;
      const rawInput = input.trim().replace(/\s+/g, "");
      const hiraInput = toHiragana(rawInput);

      const stripSuffix = (s) => s.replace(/(市|区|町|村|し|く|まち|むら)$/, "");
      const rawNoSuffix = stripSuffix(rawInput);
      const hiraNoSuffix = stripSuffix(hiraInput);

      const targetName = target.capital.replace(/\s+/g, "");
      const targetRuby = target.capitalRuby.replace(/\s+/g, "");

      const validCandidates = [
        targetName,
        targetRuby,
        stripSuffix(targetName),
        stripSuffix(targetRuby)
      ];

      // 東京都の場合：小学校社会科に合わせて「東京」「とうきょう」も「新宿」も正解とする
      if (parseInt(target.code, 10) === 13) {
        validCandidates.push("東京", "とうきょう", "東京都", "とうきょうと", "新宿", "しんじゅく", "新宿区", "しんじゅくく");
      }

      return validCandidates.some(cand => {
        const candRaw = cand.replace(/\s+/g, "");
        const candHira = toHiragana(candRaw);
        const candNoSuffix = stripSuffix(candRaw);
        const candHiraNoSuffix = stripSuffix(candHira);

        return rawInput === candRaw ||
               hiraInput === candHira ||
               rawNoSuffix === candNoSuffix ||
               hiraNoSuffix === candHiraNoSuffix;
      });
    };

      const updatePrefStats = (code, isCorrect) => {

        const choices = [parseInt(targetCode, 10), distractors[0], distractors[1], distractors[2]];

      const startQuiz = (difficulty = "easy", regionKey = null, count = null, customQueue = null, practiceMode = false) => {

          queue = [...customQueue];

          const codes = [...REGION_GROUPS[regionKey].prefs];
          queue = codes.sort(() => Math.random() - 0.5);
        } else {
          const targetCount = count || 10;
          const codes = Object.keys(PREFECTURE_DATA).map(Number);
          queue = codes.sort(() => Math.random() - 0.5).slice(0, targetCount);
        }

        setQuizQueue(queue.slice(1));
        const firstCode = queue[0];
        setCurrentTarget(PREFECTURE_DATA[firstCode]);

        setMaxQuestions(queue.length);
        setTotalQuestions(0);

        setCombo(0);

      const handleAnswerSelection = (selectedPrefCode) => {

        // 効果音を再生
        playQuizSound(isCorrect);

        if (isCorrect) {
          const newCombo = combo + 1;
          const pointsGained = isPractice ? 10 : 10 + (newCombo > 1 ? (newCombo - 1) * 5 : 0);
          const newScore = score + pointsGained;
          const newCorrect = correctAnswers + 1;

          setCombo(newCombo);
          if (newCombo > maxCombo) setMaxCombo(newCombo);
          setScore(newScore);
          scoreRef.current = newScore;
          setCorrectAnswers(newCorrect);
          correctAnswersRef.current = newCorrect;
          setQuizFeedback({ correct: true, message: `素晴らしい！ +${pointsGained}pt (${newCombo}コンボ)` });

          setCombo(0);
          setQuizFeedback({ correct: false, message: `残念！正解は「${currentTarget.name}」です。` });
        }

        setTotalQuestions(nextTotal);

        let counter = 0;
        const interval = setInterval(() => {
          setRouletteKey(keys[counter % keys.length]);
          counter++;
        }, 120);

          clearInterval(interval);
          const chosenKey = keys[Math.floor(Math.random() * keys.length)];

          setFinalSelectedKey(chosenKey);
          setIsRouletteActive(false);

        const lowAccuracyList = [];
        const unattemptedList = [];
        const otherList = [];

        allCodes.forEach(code => {
          const stat = prefStats[code] || { asked: 0, correct: 0 };
          if (stat.asked === 0) {
            unattemptedList.push(code);
          } else {
            const accuracy = stat.correct / stat.asked;
            if (accuracy < 0.8) {
              lowAccuracyList.push(code);
            } else {
              otherList.push(code);
            }
          }
        });

        lowAccuracyList.sort(() => Math.random() - 0.5);
        unattemptedList.sort(() => Math.random() - 0.5);
        otherList.sort(() => Math.random() - 0.5);

        const targetQueue = [...lowAccuracyList, ...unattemptedList, ...otherList].slice(0, 10);

                                <button onClick={() => setQuizChoiceMode("touch")} className={`flex-1 py-2 px-1 rounded-xl transition-all ${quizMode === "touch" ? "bg-white text-emerald-600 shadow-sm" : "text-slate-500 hover:text-slate-800"}`}>タッチ</button>
                                <button onClick={() => setQuizChoiceMode("choices")} className={`flex-1 py-2 px-1 rounded-xl transition-all ${quizMode === "choices" ? "bg-white text-rose-500 shadow-sm" : "text-slate-500 hover:text-slate-800"}`}>四択</button>
                                
                                <div className="relative flex-1 lock-tooltip-container">
                                  <button 
                                    disabled={!isSpecialtiesUnlocked}
                                    onClick={() => setQuizChoiceMode("specialties")} 
                                    className={`w-full py-2 px-1 rounded-xl transition-all ${quizMode === "specialties" ? "bg-white text-amber-500 shadow-sm" : isSpecialtiesUnlocked ? "text-slate-500 hover:text-slate-800" : "text-slate-400 bg-slate-200/60 cursor-not-allowed"}`}
                                  >
                                    {isSpecialtiesUnlocked ? <><ruby>有名<rt>ゆうめい</rt></ruby>なもの</> : <>🔒 <ruby>有名<rt>ゆうめい</rt></ruby>なもの</>}
                                  </button>
                                  {!isSpecialtiesUnlocked && (
                                    <div className="lock-tooltip">地方モードを３つクリアでロック解除</div>
                                  )}
                                </div>
                              </div>
                              
                              <div className="bg-slate-100 p-1 rounded-2xl flex gap-1 border border-slate-200 text-xs sm:text-sm font-black w-full">
                                <div className="relative flex-1 lock-tooltip-container">
                                  <button 
                                    disabled={!isCapitalUnlocked}
                                    onClick={() => setQuizChoiceMode("capital")} 
                                    className={`w-full py-2 px-1 rounded-xl transition-all ${quizMode === "capital" ? "bg-white text-blue-500 shadow-sm" : isCapitalUnlocked ? "text-slate-500 hover:text-slate-800" : "text-slate-400 bg-slate-200/60 cursor-not-allowed"}`}
                                  >
                                    {isCapitalUnlocked ? <>県庁所在地(四択)</> : <>🔒 県庁所在地(四択)</>}
                                  </button>
                                  {!isCapitalUnlocked && (
                                    <div className="lock-tooltip">地方モードを全部クリアでロック解除</div>
                                  )}
                                </div>

                                <div className="relative flex-1 lock-tooltip-container">
                                  <button 
                                    disabled={!isCapitalInputUnlocked}
                                    onClick={() => setQuizChoiceMode("capitalInput")} 
                                    className={`w-full py-2 px-1 rounded-xl transition-all ${quizMode === "capitalInput" ? "bg-white text-indigo-500 shadow-sm" : isCapitalInputUnlocked ? "text-slate-500 hover:text-slate-800" : "text-slate-400 bg-slate-200/60 cursor-not-allowed"}`}
                                  >
                                    {isCapitalInputUnlocked ? <>県庁所在地(入力)</> : <>🔒 県庁所在地(入力)</>}
                                  </button>
                                  {!isCapitalInputUnlocked && (
                                    <div className="lock-tooltip">全国モードを全部クリアでロック解除</div>
                                  )}
                                </div>
                              </div>
                            </div>
                            
                            <div className="flex flex-col gap-2.5">
                              <button onClick={() => setShowPracticeSelect(true)} className="w-full bg-sky-500 hover:bg-sky-600 text-white font-extrabold py-2 px-4 rounded-xl transition-all shadow-md text-sm sm:text-base hover:-translate-y-0.5">🔰 <ruby>練習<rt>れんしゅう</rt></ruby>モード</button>
                              
                              <div className="grid grid-cols-2 gap-3">
                                <button onClick={() => setShowRegionSelect(true)} className="w-full h-32 sm:h-36 bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold p-3 rounded-2xl transition-all shadow-md text-base sm:text-lg hover:-translate-y-0.5 flex flex-col items-center justify-center gap-2">
                                  <span className="text-3xl sm:text-4xl">🗺️</span>
                                  <span><ruby>地方<rt>ちほう</rt></ruby>モード</span>
                                </button>
                                <button onClick={() => setShowNationalSelect(true)} className="w-full h-32 sm:h-36 bg-rose-500 hover:bg-rose-600 text-white font-extrabold p-3 rounded-2xl transition-all shadow-md text-base sm:text-lg hover:-translate-y-0.5 flex flex-col items-center justify-center gap-2">
                                  <span className="text-3xl sm:text-4xl">🎌</span>
                                  <span><ruby>全国<rt>ぜんこく</rt></ruby>モード</span>
                                </button>
                              </div>

                              <button onClick={startRecommendedQuiz} className="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-extrabold py-2.5 px-4 rounded-xl transition-all shadow-md text-sm sm:text-base hover:-translate-y-0.5">🔥 おすすめ（<ruby>弱点克服<rt>じゃくてんこくふく</rt></ruby>）モード</button>
                            </div>
                          </div>
                        );
                      })()}
                    </div>
                  </div>
                )}
              </section>
            )}

            {}
            <aside className={quizFinished ? "lg:col-span-12 max-w-2xl mx-auto w-full" : "lg:col-span-5 flex flex-col gap-4 w-full"}>
              
              {quizActive && !quizFinished && (
                <div className="bg-white border border-slate-200 rounded-3xl p-4 shadow-sm flex flex-col gap-4">
                  <div className="flex justify-between items-center"><h3 className="text-sm font-bold text-slate-800 flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block animate-ping"></span>クイズに<ruby>挑戦中<rt>ちょうせんちゅう</rt></ruby>！</h3></div>
                  <div className="bg-slate-50 border border-slate-200 p-3 rounded-2xl flex flex-col gap-2">
                    <div className="flex justify-between text-xs font-bold text-slate-500"><span>クリア<ruby>進捗<rt>しんちょく</rt></ruby></span><span>{totalQuestions} / {maxQuestions} <ruby>問<rt>もん</rt></ruby></span></div>
                    <div className="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden"><div className="bg-gradient-to-r from-rose-500 to-amber-400 h-full transition-all duration-300" style={{ width: `${(totalQuestions / maxQuestions) * 100}%` }}></div></div>
                  </div>
                  <div className="text-[11px] text-slate-500 flex flex-col gap-0.5 border-t border-slate-100 pt-3">
                    <span className="font-bold text-slate-700">💡 <ruby>得点<rt>とくてん</rt></ruby>のヒミツ:</span>
                    <span>・1<ruby>問正解<rt>もんせいかい</rt></ruby>ごとにベース 10 ポイント<ruby>加算<rt>かさん</rt></ruby>されます。</span>
                    <span>・コンボ（<ruby>連撃<rt>れんげき</rt></ruby>）が<ruby>続<rt>つづ</rt></ruby>くと<ruby>加算<rt>かさん</rt></ruby>ポイントが<ruby>徐々<rt>じょじょ</rt></ruby>にアップします。</span>
                    <span>・タイムアップ（30<ruby>秒経過<rt>びょうけいか</rt></ruby>）になると<ruby>自動<rt>じどう</rt></ruby>で<ruby>次<rt>つぎ</rt></ruby>の<ruby>問題<rt>もんだい</rt></ruby>に<ruby>移<rt>うつ</rt></ruby>ります。</span>
                  </div>
                </div>
              )}

              {!quizActive && !quizFinished && selectedPref && (
                <div className="bg-white border-2 border-emerald-400 rounded-3xl p-4 shadow-md animate-fade-in flex flex-col gap-3 relative overflow-hidden">
                  <div className="absolute top-0 right-0 bg-emerald-500 text-white font-extrabold text-[10px] px-3 py-1 rounded-bl-xl tracking-wider">📚 <ruby>図鑑モード<rt>ずかんもーど</rt></ruby></div>
                  <div>
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">{selectedPref.english}</span>
                    <h3 className="text-2xl font-black text-slate-800 mt-0.5"><ruby>{selectedPref.name}<rt>{selectedPref.ruby}</rt></ruby></h3>
                  </div>
                  <div className="grid grid-cols-2 gap-2 bg-slate-50 p-3 rounded-2xl border border-slate-100 text-xs">
                    <div><p className="text-slate-400 font-bold"><ruby>県庁所在地<rt>けんちょうしょざいち</rt></ruby></p><p className="text-slate-800 font-extrabold text-xs mt-0.5"><ruby>{selectedPref.capital}<rt>{selectedPref.capitalRuby}</rt></ruby></p></div>
                    <div><p className="text-slate-400 font-bold"><ruby>地方名<rt>ちほうめい</rt></ruby></p><p className="text-slate-800 font-extrabold text-xs mt-0.5"><ruby>{selectedPref.regionName}<rt>{selectedPref.regionRuby}</rt></ruby></p></div>
                  </div>
                  <div>
                    <p className="text-[11px] font-bold text-slate-400"><ruby>名物・有名なもの<rt>めいぶつ・ゆうめいなもの</rt></ruby></p>
                    <p className="text-emerald-700 font-extrabold text-xs mt-0.5 bg-emerald-50 p-2.5 rounded-xl border border-emerald-100/60 leading-relaxed">
                      {renderSpecialtiesList(selectedPref.specialties, false)}
                    </p>
                  </div>
                  <button onClick={() => setSelectedCode(null)} className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-extrabold text-xs py-2 rounded-xl transition-all">選択を解除して閉じる</button>
                </div>
              )}

              {quizFinished && (
                <div className={`${isPractice ? "bg-amber-50 border-amber-200" : "bg-white border-slate-200"} border rounded-[2rem] p-6 shadow-md flex flex-col gap-4 animate-fade-in max-w-2xl mx-auto w-full`}>
                  
                  <div className="text-center">
                    {selectedRegionKey && REGION_GROUPS[selectedRegionKey] ? <p className="text-lg sm:text-xl font-black text-slate-700">【<ruby>{REGION_GROUPS[selectedRegionKey].name}<rt>{REGION_GROUPS[selectedRegionKey].ruby}</rt></ruby>】<ruby>地方挑戦<rt>ちほうちょうせん</rt></ruby>お<ruby>疲<rt>つか</rt></ruby>れさまでした！</p> : <p className="text-lg sm:text-xl font-black text-slate-700">{maxQuestions}<ruby>問<rt>もん</rt></ruby>のチャレンジお<ruby>疲<rt>つか</rt></ruby>れさまでした！</p>}
                  </div>

                  {showKusudama && (
                    <div className="flex flex-col items-center justify-center relative overflow-hidden bg-gradient-to-b from-amber-50/50 to-white rounded-2xl border border-amber-100 shadow-inner transition-all duration-1000 ease-in-out" style={{ opacity: kusudamaFadeOut ? 0 : 1, height: kusudamaFadeOut ? "0px" : "200px", marginTop: kusudamaFadeOut ? "0px" : "12px", marginBottom: kusudamaFadeOut ? "0px" : "12px", paddingTop: kusudamaFadeOut ? "0px" : "12px", paddingBottom: kusudamaFadeOut ? "0px" : "12px", borderWidth: kusudamaFadeOut ? "0px" : "1px" }}>
                      <div className="w-1 h-8 bg-slate-400 absolute top-0"></div>
                      <div className="relative w-28 h-28 flex justify-center items-center mt-4">
                        <div className="absolute left-0 w-[56px] h-[112px] bg-gradient-to-r from-amber-300 to-amber-500 border-r-2 border-yellow-300 rounded-l-full origin-right transition-all duration-[1200ms] ease-out shadow-md z-20" style={{ transform: isKusudamaOpen ? "translateX(-100px) rotate(-45deg) scale(0.7)" : "translateX(0) rotate(0deg) scale(1)", opacity: isKusudamaOpen ? 0.1 : 1 }}><div className="absolute bottom-2 left-2 w-2 h-6 bg-red-500 rounded-full origin-top transform rotate-12"></div></div>
                        <div className="absolute right-0 w-[56px] h-[112px] bg-gradient-to-l from-amber-300 to-amber-500 border-l-2 border-yellow-300 rounded-r-full origin-left transition-all duration-[1200ms] ease-out shadow-md z-20" style={{ transform: isKusudamaOpen ? "translateX(100px) rotate(45deg) scale(0.7)" : "translateX(0) rotate(0deg) scale(1)", opacity: isKusudamaOpen ? 0.1 : 1 }}><div className="absolute bottom-2 right-2 w-2 h-6 bg-red-500 rounded-full origin-top transform -rotate-12"></div></div>
                        <div className="absolute top-2 w-36 bg-gradient-to-b from-red-500 to-red-600 text-white font-black text-center shadow-lg border-2 border-yellow-300 rounded-b-xl flex flex-col justify-between py-2 z-30 transition-all duration-1000 ease-out overflow-hidden" style={{ opacity: isKusudamaOpen ? 1 : 0, height: isKusudamaOpen ? "110px" : "0", transform: isKusudamaOpen ? "translateY(10px) scale(1)" : "translateY(-40px) scale(0.5)", boxShadow: "0 10px 15px -3px rgba(220, 38, 38, 0.3)" }}>
                          <p className="text-[10px] tracking-widest text-yellow-200">🎊 <ruby>祝<rt>しゅく</rt></ruby> 🎊</p><h4 className="text-base tracking-wider text-white font-extrabold my-0.5"><ruby>新記録達成<rt>しんきろくたっせい</rt></ruby>！</h4><p className="text-[9px] text-yellow-100">おめでとうございます！</p>
                        </div>
                      </div>
                    </div>
                  )}

                  {(newRecords.score || newRecords.correct || newRecords.combo || newRecords.time) && (
                    <div className="bg-amber-50 border-2 border-amber-300 rounded-2xl p-4 text-center flex flex-col items-center gap-1.5 animate-pulse my-1">
                      <span className="text-2xl">🎉</span><h4 className="text-xl font-black text-amber-600 flex gap-1">🏆 <ruby>新記録<rt>しんきろく</rt></ruby>！</h4>
                      <div className="flex flex-col gap-1.5 mt-1 w-full max-w-sm">
                        {newRecords.score && <div className="flex justify-between items-center bg-white px-3 py-1.5 rounded-lg border border-amber-100"><span className="text-xs font-bold text-slate-500">✨ <ruby>獲得<rt>かくとく</rt></ruby>スコア<ruby>更新<rt>こうしん</rt></ruby>！</span><span className="text-lg font-black text-rose-500">{score} ポイント</span></div>}
                        {newRecords.correct && <div className="flex justify-between items-center bg-white px-3 py-1.5 rounded-lg border border-amber-100"><span className="text-xs font-bold text-slate-500">✨ <ruby>正解数更新<rt>せいかいすうこうしん</rt></ruby>！</span><span className="text-lg font-black text-emerald-600">{correctAnswers} / {maxQuestions} <ruby>問<rt>もん</rt></ruby></span></div>}
                        {newRecords.combo && <div className="flex justify-between items-center bg-white px-3 py-1.5 rounded-lg border border-amber-100"><span className="text-xs font-bold text-slate-500">✨ <ruby>連続正解数更新<rt>れんぞくせいかいすうこうしん</rt></ruby>！</span><span className="text-lg font-black text-amber-500">{maxCombo} 連続</span></div>}
                        {newRecords.time && <div className="flex justify-between items-center bg-white px-3 py-1.5 rounded-lg border border-amber-100"><span className="text-xs font-bold text-slate-500">✨ <ruby>全問正解<rt>ぜんもんせいかい</rt></ruby>タイム<ruby>更新<rt>こうしん</rt></ruby>！</span><span className="text-lg font-black text-blue-500">{(() => { const sec = elapsedTime / 1000; return sec <= 10 ? `${sec.toFixed(1)}秒` : `${Math.round(sec)}秒`; })()}</span></div>}
                      </div>
                    </div>
                  )}

                  {!isPractice && (
                    <div className="bg-slate-50 rounded-xl p-3 border border-slate-200 text-center">
                      <p className="text-[10px] text-slate-400 font-bold uppercase"><ruby>称号<rt>しょうごう</rt></ruby></p>
                      <h4 className={`text-xl sm:text-2xl font-black mt-1 ${getRankEvaluator().color}`}>{getRankEvaluator().title}</h4>
                      <p className="text-xs text-slate-600 mt-1.5 font-medium leading-relaxed">{getRankEvaluator().desc}</p>
                    </div>
                  )}

                  <div className="grid grid-cols-2 gap-3">
                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 text-center"><p className="text-[10px] text-slate-400 font-bold uppercase"><ruby>獲得<rt>かくとく</rt></ruby>スコア</p><span className="text-2xl font-black text-rose-500">{score} ポイント</span></div>
                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 text-center"><p className="text-[10px] text-slate-400 font-bold uppercase"><ruby>正解数<rt>せいかいすう</rt></ruby> / <ruby>出題数<rt>しゅつだいすう</rt></ruby></p><span className="text-2xl font-black text-emerald-600">{correctAnswers} / {maxQuestions}問</span></div>
                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 text-center"><p className="text-[10px] text-slate-400 font-bold uppercase"><ruby>連続正解数<rt>れんぞくせいかいすう</rt></ruby></p><span className="text-2xl font-black text-amber-500">{maxCombo} 連続</span></div>
                    {correctAnswers === maxQuestions ? (
                      <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 text-center"><p className="text-[10px] text-slate-400 font-bold uppercase"><ruby>全問正解<rt>ぜんもんせいかい</rt></ruby>タイム</p><span className="text-2xl font-black text-blue-500">{(() => { const sec = elapsedTime / 1000; return sec <= 10 ? `${sec.toFixed(1)}秒` : `${Math.round(sec)}秒`; })()}</span></div>
                    ) : (
                      <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 text-center flex flex-col justify-center bg-slate-100/50"><p className="text-[10px] text-slate-400 font-bold uppercase"><ruby>全問正解<rt>ぜんもんせいかい</rt></ruby>タイム</p><span className="text-xs font-bold text-slate-400 mt-1">（<ruby>全問正解時<rt>ぜんもんせいかいじ</rt></ruby>のみ）</span></div>
                    )}
                  </div>

                  <div className="flex flex-col gap-2 mt-1">
                    {!isMultiMode && (
                      <button onClick={() => startQuiz(quizDifficulty, selectedRegionKey, maxQuestions, quizQueue.length ? quizQueue : null)} className="w-full bg-rose-500 hover:bg-rose-600 text-white font-extrabold py-3 px-5 rounded-xl transition-all shadow-md text-sm text-center">🔄 <ruby>同<rt>おな</rt></ruby>じ<ruby>条件<rt>じょうけん</rt></ruby>でもう<ruby>一度遊<rt>いちどあそ</rt></ruby>ぶ</button>
                    )}
                    <button onClick={() => { setQuizFinished(false); setSelectedRegionKey(null); }} className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-extrabold py-3 px-5 rounded-xl transition-all text-sm text-center border border-slate-200">🏠 ホームに戻る</button>
                  </div>
                </div>
              )}

            </aside>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
