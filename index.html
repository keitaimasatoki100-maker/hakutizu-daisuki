      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') {
          ctx.resume();
        }
        const now = ctx.currentTime;

        if (isCorrect) {
          // ピンポン（正解音）
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(659.25, now); // ミ (E5)
          gain1.gain.setValueAtTime(0.3, now);
          gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.15);

          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(880, now + 0.15); // ラ (A5)
          gain2.gain.setValueAtTime(0.35, now + 0.15);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(now + 0.15);
          osc2.stop(now + 0.6);
        } else {
          // ブブー（不正解音）
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = 'sawtooth';
          osc1.frequency.setValueAtTime(150, now);
          gain1.gain.setValueAtTime(0.3, now);

          osc2.start(now + 0.25);

    const PLACES = PLACE_DATA.map(([category, name, ruby, prefs], i) => {
      const g = PLACE_GEO[category + "|" + name];
      return {
        isPlace: true, id: PLACE_ID_BASE + i, code: "0", category, name, ruby, prefs,
        geo: g ? { t: g[0], p: g[1], rx: g[2] || 0, ry: g[3] || 0, rot: g[4] || 0 } : null
      };
    });

    // 場所クイズの出題リストを作る
    //   filterPrefs: この都道府県のどれかにある場所だけ（null なら全部）
    //   limit: 問題数の上限（null なら全部）
    //   onlyCategory: この項目だけ（null なら全部）
    // 出題順は、川→山→平野→湖→世界遺産→温泉地→観光地 と、項目ごとにまとめます
    const buildPlaceQueue = (filterPrefs, limit, onlyCategory) => {
      const catIndex = (i) => PLACE_CATEGORIES.indexOf(PLACES[i].category);
      let ids = PLACES.map((_, i) => i)
        .filter(i => !filterPrefs || PLACES[i].prefs.some(c => filterPrefs.includes(c)))
        .filter(i => !onlyCategory || PLACES[i].category === onlyCategory)
        .sort(() => Math.random() - 0.5)
        .sort((a, b) => catIndex(a) - catIndex(b));
      const seen = new Set();
      ids = ids.filter(i => {
        if (seen.has(PLACES[i].name)) return false; // 同じ名前（富士山・厳島神社など）は1回だけ
        seen.add(PLACES[i].name);
        return true;
      });
      if (limit && ids.length > limit) {
        const keep = new Set(ids.map((_, k) => k).sort(() => Math.random() - 0.5).slice(0, limit));
        ids = ids.filter((_, k) => keep.has(k));
      }
      return ids.map(i => PLACE_ID_BASE + i);
    };
    const getQuizItem = (id) => (id >= PLACE_ID_BASE ? PLACES[id - PLACE_ID_BASE] : PREFECTURE_DATA[id]);

    // 場所クイズの四択：同じ項目（川なら川）の中から、まちがいの選択肢を3つ選ぶ
    const generatePlaceChoices = (id) => {
      const target = PLACES[id - PLACE_ID_BASE];
      const usedNames = new Set([target.name]);
      const picked = [];
      PLACES.map((_, i) => i)
        .filter(i => PLACES[i].category === target.category)
        .sort(() => Math.random() - 0.5)
        .forEach(i => {
          if (picked.length < 3 && !usedNames.has(PLACES[i].name)) {
            usedNames.add(PLACES[i].name);
            picked.push(PLACE_ID_BASE + i);
          }
        });
      return [id, ...picked].sort(() => Math.random() - 0.5);
    };

    // ---- 場所を地図の位置に直すための道具 ----
    const ringFromNumbers = (str) => {
      const nums = (String(str).match(/-?\d+(?:\.\d+)?/g) || []).map(Number);
      const ring = [];
      for (let i = 0; i + 1 < nums.length; i += 2) ring.push([nums[i], nums[i + 1]]);
      return ring;
    };
    const ringArea = (ring) => {
      let s = 0;
      for (let i = 0; i < ring.length; i++) {
        const [x1, y1] = ring[i];
        const [x2, y2] = ring[(i + 1) % ring.length];
        s += x1 * y2 - x2 * y1;
      }
      return Math.abs(s / 2);
    };
    const ringCentroid = (ring) => {
      let sx = 0, sy = 0;
      ring.forEach(([x, y]) => { sx += x; sy += y; });
      return [sx / ring.length, sy / ring.length];
    };
    const pointInRing = (ring, x, y) => {
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const [xi, yi] = ring[i];
        const [xj, yj] = ring[j];
        if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
      }
      return inside;
    };
    // 都道府県の形データ（ring のならび・いちばん大きい ring のわく・移動量）を作る
    const buildShapeGeo = (children, transform) => {
      const rings = [];
      children.forEach(ch => {
        if (ch.tag === "polygon") {
          const r = ringFromNumbers(ch.v);
          if (r.length >= 3) rings.push(r);
        } else {
          String(ch.v).split(/[Mm]/).forEach(seg => {
            const r = ringFromNumbers(seg);
            if (r.length >= 3) rings.push(r);
          });
        }
      });
      let main = null, mainArea = -1;
      rings.forEach(r => { const a = ringArea(r); if (a > mainArea) { mainArea = a; main = r; } });
      const tm = /translate\(\s*(-?[\d.]+)[\s,]+(-?[\d.]+)\s*\)/.exec(transform || "");
      const bbox = { minx: 0, maxx: 1, miny: 0, maxy: 1 };
      if (main) {
        bbox.minx = Math.min(...main.map(p => p[0])); bbox.maxx = Math.max(...main.map(p => p[0]));
        bbox.miny = Math.min(...main.map(p => p[1])); bbox.maxy = Math.max(...main.map(p => p[1]));
      }
      return { tx: tm ? parseFloat(tm[1]) : 0, ty: tm ? parseFloat(tm[2]) : 0, rings, bbox };
    };
    // 海にはみ出した点は、近くの陸地の中に引きもどす
    const fixPointInPref = (geo, x, y) => {
      if (geo.rings.some(r => pointInRing(r, x, y))) return [x, y];
      let best = null, bd = Infinity;
      geo.rings.forEach(r => r.forEach(([vx, vy]) => {
        const d = Math.hypot(vx - x, vy - y);
        if (d < bd) { bd = d; best = { r, vx, vy }; }
      }));
      if (!best || bd > 10) return [x, y];
      const c = ringCentroid(best.r);
      for (let t = 0; t <= 1.0001; t += 0.1) {
        const qx = best.vx + (c[0] - best.vx) * t;
        const qy = best.vy + (c[1] - best.vy) * t;
        if (pointInRing(best.r, qx, qy)) return [qx, qy];
      }
      return [best.vx, best.vy];
    };
    // 場所の点 [都道府県, 緯度, 経度] を、地図の都道府県グループ内の位置 [x, y] に直す
    const placePointToAbs = (p, zoomKyushu) => {
      const code = p[0] === "xy" ? p[1] : p[0];
      const shape = PREFECTURE_SHAPES.find(s => s.code === code);
      if (!shape || !shape.geo) return null;
      let x, y;
      if (p[0] === "xy") {
        x = p[2]; y = p[3];
      } else {
        const g = PREFECTURE_GEO[code];
        if (!g) return null;
        const bb = shape.geo.bbox;
        const fx = (p[2] - g[0]) / (g[1] - g[0]);
        const fy = (g[3] - p[1]) / (g[3] - g[2]);
        [x, y] = fixPointInPref(shape.geo, bb.minx + fx * (bb.maxx - bb.minx), bb.miny + fy * (bb.maxy - bb.miny));
      }
      // 九州・沖縄ズームのとき、沖縄と北海道は左下に小さく移動して表示される
      if ((code === 47 || code === 1) && zoomKyushu) return [-80 + 0.5 * x, 1040 + 0.5 * y];
      return [shape.geo.tx + x, shape.geo.ty + y];
    };
    const starPoints = (cx, cy, R, r) => {
      const pts = [];
      for (let i = 0; i < 10; i++) {
        const rad = i % 2 === 0 ? R : r;
        const ang = -Math.PI / 2 + (i * Math.PI) / 5;
        pts.push((cx + rad * Math.cos(ang)).toFixed(1) + "," + (cy + rad * Math.sin(ang)).toFixed(1));
      }
      return pts.join(" ");
    };

    // 地方名のラベル（地図データの class 名 → 表示名）
    const REGION_INFO = {
      hokkaido: { name: "北海道", ruby: "ほっかいどう" },
      tohoku: { name: "東北", ruby: "とうほく" },
      kanto: { name: "関東", ruby: "かんとう" },
      chubu: { name: "中部", ruby: "ちゅうぶ" },
      kinki: { name: "近畿", ruby: "きんき" },
      chugoku: { name: "中国", ruby: "ちゅうごく" },
      shikoku: { name: "四国", ruby: "しこく" },
      kyushu: { name: "九州", ruby: "きゅうしゅう" },
      okinawa: { name: "沖縄", ruby: "おきなわ" }
    };

    // 「地図データ」タブの SVG から都道府県データを作る
    const parseMapSvg = (rawSvg) => {
      const svgText = String(rawSvg).replace(/[\u200B-\u200D\uFEFF]/g, "").trim();
      const doc = new DOMParser().parseFromString(svgText, "image/svg+xml");
      if (doc.getElementsByTagName("parsererror").length > 0) {
        throw new Error("「地図データ」のSVGを読み取れませんでした。");
      }
      const groups = Array.from(doc.getElementsByTagName("g")).filter(g => {
        const cls = (g.getAttribute("class") || "").split(/\s+/);
        return cls.includes("prefecture") && g.getAttribute("data-code");
      });

      const newData = {};
      const newShapes = [];
      groups.forEach(g => {
        const code = parseInt(g.getAttribute("data-code"), 10);
        if (!code) return;
        const tokens = (g.getAttribute("class") || "").split(/\s+/).filter(Boolean);
        const region = tokens.find(t => REGION_INFO[t]) || "chubu";
        const prefClass = tokens.find(t => t !== "prefecture" && t !== "kyushu-okinawa" && (t !== region || region === "hokkaido" || region === "okinawa")) || ("pref" + code);

        const titleEl = g.getElementsByTagName("title")[0];
        const titleText = titleEl ? titleEl.textContent : "";
        const parts = titleText.split("/").map(s => s.trim());
        const jpName = parts[0] || ("都道府県" + code);
        const enRaw = parts[1] || "";
        const english = enRaw ? enRaw.charAt(0).toUpperCase() + enRaw.slice(1) : "";

        // 地図データ（番号・名前・英語名・地方）に、補足データ（正式名・ふりがななど）を合わせる
        const extra = PREFECTURE_EXTRA[code] || {};
        newData[code] = {
          code: String(code),
          name: extra.name || jpName,
          ruby: extra.ruby || "",
          english: english,
          capital: extra.capital || "",
          capitalRuby: extra.capitalRuby || "",
          region: region,
          regionName: REGION_INFO[region].name,
          regionRuby: REGION_INFO[region].ruby,
          specialties: extra.specialties || []
        };

        const children = [];
        Array.from(g.children).forEach(el => {
          const tag = el.tagName.toLowerCase();
          if (tag === "polygon") children.push({ tag: "polygon", v: el.getAttribute("points") });
          else if (tag === "path") children.push({ tag: "path", v: el.getAttribute("d") });
        });

        newShapes.push({
          code: code,
          cls: prefClass,
          transform: g.getAttribute("transform") || "",
          children: children,
          geo: buildShapeGeo(children, g.getAttribute("transform") || "")
        });
      });

      if (Object.keys(newData).length < 47) {
        throw new Error("「地図データ」に47都道府県そろっていません（" + Object.keys(newData).length + "件）。");
      }

      // 東京都は神奈川・埼玉・千葉より手前に描く（タップしやすくするため）
      const tokyoIdx = newShapes.findIndex(s => s.code === 13);
      if (tokyoIdx >= 0) {
        const tokyo = newShapes.splice(tokyoIdx, 1)[0];
        let insertAt = -1;
        newShapes.forEach((s, i) => { if (s.code === 11 || s.code === 12 || s.code === 14) insertAt = Math.max(insertAt, i); });
        newShapes.splice(insertAt + 1, 0, tokyo);
      }

      Object.keys(PREFECTURE_DATA).forEach(k => delete PREFECTURE_DATA[k]);
      Object.assign(PREFECTURE_DATA, newData);
      PREFECTURE_SHAPES.length = 0;
      newShapes.forEach(s => PREFECTURE_SHAPES.push(s));
    };

    // gviz のレスポンス（JSON）から SVG 文字列を探す
    const findSvgInGvizResponse = (resp) => {
      const table = resp && resp.table;
      if (!table) return null;
      const candidates = [];
      (table.cols || []).forEach(c => { if (c && typeof c.label === "string") candidates.push(c.label); });
      (table.rows || []).forEach(r => {
        (r.c || []).forEach(cell => {

    const toHiragana = (str) => {

    };

    const checkCapitalAnswer = (input, target) => {
      if (!input || !target) return false;
      const rawInput = input.trim().replace(/\s+/g, "");
      const hiraInput = toHiragana(rawInput);

      const stripSuffix = (s) => s.replace(/(市|区|町|村|し|く|まち|むら)$/, "");
      const rawNoSuffix = stripSuffix(rawInput);
      const hiraNoSuffix = stripSuffix(hiraInput);

      const targetName = target.capital.replace(/\s+/g, "");
      const targetRuby = target.capitalRuby.replace(/\s+/g, "");

      const validCandidates = [
        targetName,
        targetRuby,
        stripSuffix(targetName),
        stripSuffix(targetRuby)
      ];

      // 東京都の場合：小学校社会科に合わせて「東京」「とうきょう」も「新宿」も正解とする
      if (parseInt(target.code, 10) === 13) {

      }

      return validCandidates.some(cand => {
        const candRaw = cand.replace(/\s+/g, "");
        const candHira = toHiragana(candRaw);
        const candNoSuffix = stripSuffix(candRaw);
        const candHiraNoSuffix = stripSuffix(candHira);

        return rawInput === candRaw ||
               hiraInput === candHira ||
               rawNoSuffix === candNoSuffix ||
               hiraNoSuffix === candHiraNoSuffix;
      });
    };

    const ShufflingSpecialties = ({ items }) => {

      useEffect(() => {
        setOrder(items);

          setOrder(prev => {
            const next = [...prev];
            for (let i = next.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [next[i], next[j]] = [next[j], next[i]];
            }

            if (next.every((x, i) => x === prev[i])) next.push(next.shift());

      const [newRecords, setNewRecords] = useState({ score: false, correct: false, combo: false, time: false });

      // WebRTC PeerJS Refs
      const peerRef = useRef(null);
      const hostConnsRef = useRef([]);
      const guestConnRef = useRef(null);
      const multiRoomRef = useRef(null);

      const selectedPref = selectedCode ? PREFECTURE_DATA[selectedCode] : null;

      // カテゴリごとの最高記録を取り出す（日本の地方は、これまでの最高スコアも引きつぐ）
      const getCatBest = (key) => {
        const b = (key && categoryBests[key]) || {};
        let score = b.score || 0;
        if (key && key.indexOf("japan:") === 0 && key.indexOf("japan:all") !== 0) {
          score = Math.max(score, regionBestScores[key.slice(6)] || 0);
        }
        return { score, combo: b.combo || 0 };
      };
      const bestLine = (key) => {

      };
      const regionCatKey = (regionKey) => quizMode === "places" ? "places:region:" + regionKey : mapSet + ":" + regionKey;

      const perfectRegionCount = useMemo(() => {
        let count = 0;

          if (bestTimeForRegion && bestTimeForRegion < 999999) {

          }

      }, [regionBestTimes]);

      // 「地図データ」に名物・県庁所在地のデータが入っているかどうか
      const hasSpecialtiesData = Object.values(PREFECTURE_DATA).some(p => p.specialties && p.specialties.length > 0);
      const hasCapitalData = Object.values(PREFECTURE_DATA).some(p => p.capital);

      const isSpecialtiesUnlocked = hasSpecialtiesData && perfectRegionCount >= 3;
      const isCapitalUnlocked = hasCapitalData && perfectRegionCount >= 7;
      const isCapitalInputUnlocked = hasCapitalData && (bestTime < 999999) && (bestCorrect >= 47);

      const [newlyUnlockedMsg, setNewlyUnlockedMsg] = useState("");

      useEffect(() => {
        let msg = "";
        if (isCapitalInputUnlocked) {
          msg = "🎉 「県庁所在地（入力）」ができるようになりました！";
        } else if (isCapitalUnlocked) {
          msg = "🎉 「県庁所在地（四択）」ができるようになりました！";
        } else if (isSpecialtiesUnlocked) {
          msg = "🎉 「有名なもの」ができるようになりました！";
        }
        setNewlyUnlockedMsg(msg);
      }, [isSpecialtiesUnlocked, isCapitalUnlocked, isCapitalInputUnlocked]);

      const activeZoomRegionKey = useMemo(() => {
        if (quizRecommendedActive && currentTarget) {
          return currentTarget.region === "hokkaido" || currentTarget.region === "tohoku" ? "hokkaido_tohoku"
            : currentTarget.region === "kyushu" || currentTarget.region === "okinawa" ? "kyushu_okinawa"
            : currentTarget.region;
        }
        return selectedRegionKey;
      }, [quizRecommendedActive, currentTarget, selectedRegionKey, mapSet]);

      const currentViewBox = useMemo(() => {
        // 場所クイズ：描きこまれた場所が見やすいように、その場所のまわりに地図をズームする
        if (quizActive && quizMode === "places" && currentTarget && currentTarget.isPlace && currentTarget.geo) {
          const zk = activeZoomRegionKey === "kyushu_okinawa" || rouletteKey === "kyushu_okinawa";
          const abs = currentTarget.geo.p.map(p => placePointToAbs(p, zk)).filter(Boolean)
            .map(([x, y]) => [1.028807 * (x + 6) - 47.544239, 1.028807 * (y + 18) - 28.806583]);
          if (abs.length > 0) {
            const g = currentTarget.geo;
            const ext = g.t === "area" ? Math.max(g.rx, g.ry) * 1.03 : 0;
            let x0 = Math.min(...abs.map(a => a[0])) - ext, x1 = Math.max(...abs.map(a => a[0])) + ext;
            let y0 = Math.min(...abs.map(a => a[1])) - ext, y1 = Math.max(...abs.map(a => a[1])) + ext;
            const padX = Math.max(40, (x1 - x0) * 0.15), padY = Math.max(40, (y1 - y0) * 0.15);
            x0 -= padX; x1 += padX; y0 -= padY; y1 += padY;
            // まわりの県も見えるくらいの最小の大きさ（横長の画面に合わせる）
            let w = Math.max(x1 - x0, 330), h = Math.max(y1 - y0, 200);
            if (w / h < 1.6) w = h * 1.6; else if (w / h > 1.9) h = w / 1.9;
            const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
            return `${(cx - w / 2).toFixed(0)} ${(cy - h / 2).toFixed(0)} ${w.toFixed(0)} ${h.toFixed(0)}`;
          }
        }
        const activeKey = rouletteKey || activeZoomRegionKey;
        if (activeKey && REGION_GROUPS[activeKey]) { return REGION_GROUPS[activeKey].viewBox; }
        return mapSet === "tokyo" ? TOKYO_SET.viewBox : "0 0 1000 1000";
      }, [activeZoomRegionKey, rouletteKey, mapSet, quizActive, quizMode, currentTarget]);

      const isPrefectureVisible = (code) => {
        const activeKey = rouletteKey || activeZoomRegionKey;
        if (!activeKey || !REGION_GROUPS[activeKey]) { return true; }
        return (REGION_GROUPS[activeKey].visiblePrefs || REGION_GROUPS[activeKey].prefs).includes(parseInt(code, 10));
      };

      // 出題されない市町村（多摩のエリアを選んだとき）かどうか
      const isOutOfScope = (code) => {
        const g = REGION_GROUPS[rouletteKey || activeZoomRegionKey];
        return !!(g && g.visiblePrefs && !g.prefs.includes(parseInt(code, 10)));
      };

      const showBoundaryLine = useMemo(() => {
        if (mapSet === "tokyo") return false;
        const activeKey = rouletteKey || activeZoomRegionKey;
        if (!activeKey) return true;
        return activeKey === "hokkaido_tohoku" || activeKey === "kyushu_okinawa";
      }, [activeZoomRegionKey, rouletteKey, mapSet]);

      // いまの問題の答えにあたる都道府県かどうか（場所クイズは複数の都道府県が答えになる）
      const targetHasCode = (code) => {
        if (!currentTarget) return false;
        const c = parseInt(code, 10);
        if (currentTarget.isPlace) return false;
        return parseInt(currentTarget.code, 10) === c;
      };

      const getPrefectureColor = (code) => {
        const pref = PREFECTURE_DATA[code];
        if (!pref) return "#f8fafc";
        if (quizActive && isOutOfScope(code)) return "#e5e7eb"; // 出題されないところはうすいグレー
        if (isRouletteActive && rouletteKey) {
          if (REGION_GROUPS[rouletteKey].prefs.includes(parseInt(code, 10))) { return REGION_COLORS[pref.region].fill; }
          return "#f1f5f9";
        }
        if (quizActive && quizFeedback && !quizFeedback.correct && targetHasCode(code)) {
          return "#ff4444"; 
        }
        if (quizActive && (quizMode === "choices" || quizMode === "specialties" || quizMode === "capital" || quizMode === "capitalInput") && currentTarget && parseInt(currentTarget.code, 10) === parseInt(code, 10)) {
          return "#fbbf24"; 
        }
        if (!quizActive) { return REGION_COLORS[pref.region].fill; }
        // 場所クイズでは、陸地と海が見分けやすいように陸地にうすく色をつける
        if (quizMode === "places" && quizDifficulty === "normal") { return "#dcefd0"; }
        if (quizDifficulty === "normal") { return "#f8fafc"; }
        return REGION_COLORS[pref.region].fill;
      };

      const renderPrefectureLabel = (code) => {
        if (!isPractice || (quizMode !== "touch" && quizMode !== "choices" && quizMode !== "places")) return null;
        const pos = LABEL_POSITIONS[code];
        const pref = PREFECTURE_DATA[code];
        if (!pos || !pref) return null;
        return (
          <text
            x={pos.x}
            y={pos.y}
            textAnchor="middle"
            dominantBaseline="central"
            fontSize={pos.fontSize || "22px"}
            fontWeight="300"
            fill="#0f172a"
            className="pointer-events-none select-none pref-label-blink"
            style={{
              textShadow: "2px 2px 3px #ffffff, -2px -2px 3px #ffffff, 2px -2px 3px #ffffff, -2px 2px 3px #ffffff, 0px 0px 6px #ffffff"
            }}
          >
            {pref.name}
          </text>
        );
      };

      // 小さい都道府県も確実にタップできるようにする透明ヒットサークル（隣県を侵食しないサイズに調整）
      const renderHitArea = (code) => {
        const pos = LABEL_POSITIONS[code];
        if (!pos) return null;
        const c = parseInt(code, 10);
        
        // 面積の小さい県のみ、境界を超えて隣県を覆わない最適な半径を設定
        let r = 0;
        if (c === 13) r = 16; // 東京都（東京本土の中心を確実にカバー）
        else if (c === 37) r = 14; // 香川県
        else if (c === 27) r = 14; // 大阪府
        else if (c === 41) r = 14; // 佐賀県
        else return null; // 他の県はポリゴン自体が十分な面積を持つため補助円を置かず誤判定を完全防止

        return (
          <circle
            cx={pos.x}
            cy={pos.y}
            r={r}
            fill="transparent"
            stroke="transparent"
            strokeWidth="0"
            className="cursor-pointer"
            style={{ pointerEvents: 'all' }}
          />
        );
      };

      // 「地図データ」の形データから、都道府県1つぶんの <g> を描く
      const renderPrefectureGroup = (shape) => {
        const c = shape.code;
        const isTarget = quizActive && (quizMode === "choices" || quizMode === "specialties") && currentTarget && parseInt(currentTarget.code, 10) === c;
        const zoomKyushu = activeZoomRegionKey === "kyushu_okinawa" || rouletteKey === "kyushu_okinawa";
        // 九州・沖縄ズーム時、北海道と沖縄は左下に小さく移動して表示
        const transform = (c === 47 || c === 1) && zoomKyushu ? "translate(-80, 1040) scale(0.5)" : shape.transform;
        const isSelected = selectedCode === c;
        return (
          <g
            key={c}
            onClick={() => { if (quizActive && isOutOfScope(c)) return; handlePrefectureClick(String(c)); }}
            className={`${shape.cls} prefecture ${isTarget ? "animate-pulse" : ""}`}
            strokeLinejoin="round"
            fill={getPrefectureColor(String(c))}
            fillRule="nonzero"
            stroke={isSelected ? "#ff4444" : "#000000"}
            strokeWidth={isSelected ? "3.5" : "1.5"}
            transform={transform}
            style={{ display: isPrefectureVisible(c) ? "block" : "none" }}
          >
            {shape.children.map((child, i) => (
              child.tag === "polygon"
                ? <polygon key={i} points={child.v} />
                : <path key={i} d={child.v} />
            ))}
            {renderHitArea(c)}
            {renderPrefectureLabel(c)}
          </g>
        );
      };

      const getRankEvaluator = () => {
        const rate = (correctAnswers / maxQuestions) * 100;
        if (rate === 100) return { title: <><ruby>日本地図<rt>にほんちず</rt></ruby>マスター</>, desc: <><ruby>完璧<rt>かんぺき</rt></ruby>です！あなた<ruby>以上<rt>いじょう</rt></ruby>に<ruby>日本<rt>にほん</rt></ruby>の<ruby>地理<rt>ちり</rt></ruby>を<ruby>愛<rt>あい</rt></ruby>する<ruby>人<rt>ひと</rt></ruby>はいません！</>, color: "text-rose-600" };
        if (rate >= 80) return { title: <><ruby>超<rt>ちょう</rt></ruby>・<ruby>地理<rt>ちり</rt></ruby>ツウ</>, desc: <><ruby>素晴<rt>すば</rt></ruby>らしい<ruby>成績<rt>せいせき</rt></ruby>！<ruby>日本中<rt>にほんじゅう</rt></ruby>のどこへ<ruby>行<rt>い</rt></ruby>っても<ruby>迷<rt>まよ</rt></ruby>うことはないでしょう！</>, color: "text-amber-600" };
        if (rate >= 50) return { title: <><ruby>中堅地理<rt>ちゅうけんちり</rt></ruby>ファン</>, desc: <>なかなかの<ruby>実力<rt>じりょく</rt></ruby>です！もう少し<ruby>練習<rt>れんしゅう</rt></ruby>すればマスターになれます！</>, color: "text-emerald-600" };
        return { title: <><ruby>見習<rt>みなら</rt></ruby>いトラベラー</>, desc: <>まずは<ruby>近<rt>ちか</rt></ruby>の<ruby>都道府県<rt>とどうふけん</rt></ruby>から、<ruby>少<rt>すこ</rt></ruby>しずつ<ruby>覚<rt>おぼ</rt></ruby>えていきましょう！</>, color: "text-blue-600" };
      };

      const updatePrefStats = (code, isCorrect) => {
        if (quizFeedback) return;
        if (replayRef.current) return; // 同じ問題にチャレンジ中は記録しない
        setPrefStats(prev => {
          const current = prev[code] || { asked: 0, correct: 0 };
          const updated = {
            asked: current.asked + 1,
            correct: current.correct + (isCorrect ? 1 : 0)
          };
          const nextStats = { ...prev, [code]: updated };
          safeSetLocalStorage("japan_map_quiz_pref_stats", JSON.stringify(nextStats));
          return nextStats;
        });
      };

      const generateChoices = (targetCode) => {
        const allCodes = Object.keys(PREFECTURE_DATA).map(Number);
        let distractors = allCodes.filter(c => c !== parseInt(targetCode, 10));
        if (ACTIVE_MAP_SET === "tokyo") {
          // 東京都：同じ地域（23区どうし／多摩どうし）から、まちがいの選択肢を選ぶ
          const myRegion = PREFECTURE_DATA[targetCode] && PREFECTURE_DATA[targetCode].region;
          const same = distractors.filter(c => PREFECTURE_DATA[c].region === myRegion);
          if (same.length >= 3) distractors = same;
        }
        distractors.sort(() => Math.random() - 0.5);
        const choices = [parseInt(targetCode, 10), distractors[0], distractors[1], distractors[2]];
        choices.sort(() => Math.random() - 0.5);
        return choices;
      };

      // 地図の切りかえ（日本の都道府県 ⇔ 東京都の区市町村）
      const switchMapSet = (name) => {
        if (quizActive || name === mapSet) return;
        activateMapSet(name);
        setMapSet(name);
        setSelectedCode(null);

        setQuizRecommendedActive(false);
        if (name === "tokyo" && quizMode !== "touch" && quizMode !== "choices") setQuizChoiceMode("touch");
      };

      // 場所クイズ：いまの問題の川・平野・山などを地図に描きこむ
      const renderPlaceFeature = () => {
        if (!quizActive || !currentTarget || !currentTarget.isPlace || !currentTarget.geo) return null;
        const geo = currentTarget.geo;
        const zoomKyushu = activeZoomRegionKey === "kyushu_okinawa" || rouletteKey === "kyushu_okinawa";
        const pts = geo.p.map(p => placePointToAbs(p, zoomKyushu)).filter(Boolean);
        if (pts.length === 0) return null;
        if (geo.t === "line") {
          const d = pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
          return (
            <g className="pointer-events-none">
              <polyline points={d} fill="none" stroke="#ffffff" strokeWidth="9" strokeLinecap="round" strokeLinejoin="round" />
              <polyline points={d} fill="none" stroke="#2563eb" strokeWidth="5" strokeLinecap="round" strokeLinejoin="round" className="animate-pulse" />
            </g>
          );
        }
        if (geo.t === "area") {
          const [cx, cy] = pts[0];
          return (
            <g className="pointer-events-none">
              <ellipse cx={cx} cy={cy} rx={geo.rx} ry={geo.ry} transform={`rotate(${geo.rot} ${cx} ${cy})`} fill="#2563eb" fillOpacity="0.55" stroke="#ffffff" strokeWidth="3" className="animate-pulse" />
            </g>
          );
        }
        return (
          <g className="pointer-events-none">
            {pts.map((p, i) => (
              <polygon key={i} points={starPoints(p[0], p[1], 15, 6.5)} fill="#ef4444" stroke="#ffffff" strokeWidth="3" strokeLinejoin="round" paintOrder="stroke" className="animate-pulse" />
            ))}
          </g>
        );
      };

      const handleNextQuestion = (queue, currentScore, currentCombo, currentCorrect) => {
        if (!queue || queue.length === 0) {
          endQuiz(true);
          return;
        }
        const nextCode = queue[0];
        const remainingQueue = queue.slice(1);

        setCurrentTarget(getQuizItem(nextCode));
        setCurrentChoices(nextCode >= PLACE_ID_BASE ? generatePlaceChoices(nextCode) : generateChoices(nextCode));
        setQuizQueue(remainingQueue);
        setQuizFeedback(null);
        setTimeLeft(30);
        setUserInputValue("");
      };

      const updateUserGroupStats = async (gainedScore, courseName) => {
        const currentUid = authUser?.uid || auth?.currentUser?.uid || myUserId;
        const name = multiNickname.trim() || "プレイヤー";
        const dateStr = new Date().toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });

        myGroupCodes.forEach(async (code) => {
          let updatedViaFirebase = false;
          if (firebaseAvailable && db && currentUid) {
            try {
              const groupRef = db.doc(`artifacts/${appId}/public/data/groups/${code}`);
              const updatePayload = {};
              updatePayload[`members.${currentUid}.id`] = currentUid;
              updatePayload[`members.${currentUid}.nickname`] = name;
              updatePayload[`members.${currentUid}.lastScore`] = gainedScore;
              updatePayload[`members.${currentUid}.lastPlayedAt`] = dateStr;
              updatePayload[`members.${currentUid}.lastCourse`] = courseName || "通常クイズ";
              updatePayload[`members.${currentUid}.bestScore`] = Math.max(bestScore, gainedScore);
              updatePayload[`members.${currentUid}.totalScore`] = totalScore + gainedScore;
              await groupRef.update(updatePayload);
              updatedViaFirebase = true;
            } catch (e) {
              console.warn("Firestore group update skipped due to permissions, using local fallback:", e);
            }
          }
          if (!updatedViaFirebase) {
            setAllGroupsData(prev => {
              const existing = prev[code] || { code, ownerUid: "", ownerName: "", members: {}, settings: { showRanking: false, showLastPlay: false, showScores: false } };
              const currentMember = existing.members?.[currentUid] || {};
              const updatedMember = {
                ...currentMember,
                id: currentUid,
                nickname: name,
                lastScore: gainedScore,
                lastPlayedAt: dateStr,
                lastCourse: courseName || "通常クイズ",
                bestScore: Math.max(bestScore || 0, gainedScore),
                totalScore: (totalScore || 0) + gainedScore
              };
              const nextAll = {
                ...prev,
                [code]: {
                  ...existing,
                  members: { ...existing.members, [currentUid]: updatedMember }
                }
              };
              safeSetLocalStorage("japan_map_quiz_all_groups", JSON.stringify(nextAll));
              return nextAll;
            });
          }
        });
      };

      const handleToggleGroupSetting = async (code, settingKey) => {
        const currentGroup = allGroupsData[code];
        if (!currentGroup) return;
        const currentSettings = currentGroup.settings || { showRanking: false, showLastPlay: false, showScores: false };
        const newSettingValue = !(currentSettings[settingKey] ?? false);

        const currentUid = authUser?.uid || auth?.currentUser?.uid || myUserId;
        let updatedViaFirebase = false;

        if (firebaseAvailable && db && currentUid) {
          try {
            const groupRef = db.doc(`artifacts/${appId}/public/data/groups/${code}`);
            await groupRef.update({ [`settings.${settingKey}`]: newSettingValue });
            updatedViaFirebase = true;
          } catch (e) {
            console.warn("Firestore group settings update fallback:", e);
          }
        }
        if (!updatedViaFirebase) {
          setAllGroupsData(prev => {
            const nextAll = {
              ...prev,
              [code]: {
                ...prev[code],
                settings: {
                  ...(prev[code]?.settings || { showRanking: false, showLastPlay: false, showScores: false }),
                  [settingKey]: newSettingValue
                }
              }
            };
            safeSetLocalStorage("japan_map_quiz_all_groups", JSON.stringify(nextAll));
            return nextAll;
          });
        }
      };

      const endQuiz = (isFinished = false) => {
        setQuizActive(false);
        setUserInputValue("");
        setQuizRecommendedActive(false);
        setQuizFeedback(null);

        if (isFinished) {
          setQuizFinished(true);
          const duration = quizStartTimeRef.current ? Date.now() - quizStartTimeRef.current : 0;
          setElapsedTime(duration);
          
          const gainedScore = scoreRef.current;
          // カテゴリごとの最高スコア・最高コンボを記録
          const ck = catKeyRef.current;
          if (ck) {
            const cur = getCatBest(ck);
            const nextScore = Math.max(cur.score, gainedScore);
            const nextCombo = Math.max(cur.combo, maxComboRef.current);
            if (nextScore !== cur.score || nextCombo !== cur.combo) {
              const nextBests = { ...categoryBests, [ck]: { score: nextScore, combo: nextCombo } };
              setCategoryBests(nextBests);
              safeSetLocalStorage("japan_map_quiz_category_bests", JSON.stringify(nextBests));
            }
          }
          // 場所クイズは、地方・全国モードの記録やロック解除には数えない
          const isPlacesQuiz = quizMode === "places" || ACTIVE_MAP_SET === "tokyo";
          if (!replayRef.current) setTotalScore(prevTotal => {
            const newTotalScore = prevTotal + gainedScore;
            safeSetLocalStorage("japan_map_quiz_total_score", newTotalScore.toString());
            return newTotalScore;
          });

          const courseName = isPractice ? "練習モード"
            : quizRecommendedActive ? "おすすめモード"
            : selectedRegionKey && REGION_GROUPS[selectedRegionKey] ? (ACTIVE_MAP_SET === "tokyo" ? `東京都 ${REGION_GROUPS[selectedRegionKey].name}` : `${REGION_GROUPS[selectedRegionKey].name}地方`)
            : (ACTIVE_MAP_SET === "tokyo" ? `東京都${maxQuestions}問` : `全国${maxQuestions}問`);

          if (!replayRef.current) updateUserGroupStats(gainedScore, courseName);

          let isNewScore = false; 
          let updatedBestScore = bestScore; 
          const updatedRegionBestScores = { ...regionBestScores };

          if (!isPlacesQuiz && gainedScore > bestScore) {
            isNewScore = true;
            updatedBestScore = gainedScore;
            setBestScore(gainedScore);
            safeSetLocalStorage("japan_map_quiz_best_score", gainedScore.toString());
          }

          if (!isPlacesQuiz && selectedRegionKey && gainedScore > (regionBestScores[selectedRegionKey] || 0)) {
            updatedRegionBestScores[selectedRegionKey] = gainedScore;
            setRegionBestScores(updatedRegionBestScores);
            safeSetLocalStorage(`japan_map_quiz_best_score_${selectedRegionKey}`, gainedScore.toString());
          }

          let isNewCorrect = false;
          if (!isPlacesQuiz && correctAnswersRef.current > bestCorrect) {
            isNewCorrect = true;
            setBestCorrect(correctAnswersRef.current);
            safeSetLocalStorage("japan_map_quiz_best_correct", correctAnswersRef.current.toString());
          }

          let isNewCombo = false;
          if (!isPlacesQuiz && maxCombo > bestCombo) {
            isNewCombo = true;
            setBestCombo(maxCombo);
            safeSetLocalStorage("japan_map_quiz_best_combo", maxCombo.toString());
          }

          let isNewTime = false;
          const updatedRegionBestTimes = { ...regionBestTimes };
          if (!isPlacesQuiz && correctAnswersRef.current === maxQuestions && duration > 0) {
            if (duration < bestTime) {
              isNewTime = true;
              setBestTime(duration);
              safeSetLocalStorage("japan_map_quiz_best_time", duration.toString());
            }
            if (selectedRegionKey && duration < (regionBestTimes[selectedRegionKey] || 999999)) {
              updatedRegionBestTimes[selectedRegionKey] = duration;
              setRegionBestTimes(updatedRegionBestTimes);
              safeSetLocalStorage(`japan_map_quiz_best_time_${selectedRegionKey}`, duration.toString());
            }
          }

          const isPerfect100 = (correctAnswersRef.current === maxQuestions);
          if (isPerfect100 && !isPlacesQuiz) {
            setUnlockedNationalCounts(prev => {
              let updated = { ...prev };
              if (maxQuestions === 10) updated.c20 = true;
              if (maxQuestions === 20) updated.c30 = true;
              if (maxQuestions === 30) updated.c47 = true;
              safeSetLocalStorage("japan_map_quiz_unlocked_national", JSON.stringify(updated));
              return updated;
            });
          }

          setNewRecords({ score: isNewScore, correct: isNewCorrect, combo: isNewCombo, time: isNewTime });

          if (!replayRef.current && (isPerfect100 || isNewScore || isNewCorrect || isNewCombo || isNewTime)) {
            setShowKusudama(true);
            setIsKusudamaOpen(false);
            setKusudamaFadeOut(false);

            setTimeout(() => {
              setIsKusudamaOpen(true);
              if (typeof confetti === "function") {
                confetti({ particleCount: 120, spread: 80, origin: { y: 0.4 } });
              }
            }, 400);

            setTimeout(() => {
              setKusudamaFadeOut(true);
            }, 3800);
          } else {
            setShowKusudama(false);
          }
        }
      };

      const startQuiz = (difficulty = "easy", regionKey = null, count = null, customQueue = null, practiceMode = false, replay = false) => {
        setIsPractice(practiceMode);
        setQuizDifficulty(difficulty);
        setSelectedRegionKey(regionKey);
        setShowRegionSelect(false);
        setTokyoCountKey(null);
        setShowPracticeSelect(false);
        setShowNationalSelect(false);
        setQuizFinished(false);

        let queue = [];
        if (customQueue && Array.isArray(customQueue) && customQueue.length > 0) {
          queue = [...customQueue];
        } else if (regionKey && REGION_GROUPS[regionKey]) {
          if (quizMode === "places") {
            // 場所クイズ：その地方にある場所から10問
            queue = buildPlaceQueue(REGION_GROUPS[regionKey].prefs, 10);
          } else {
            const codes = [...REGION_GROUPS[regionKey].prefs];
            queue = codes.sort(() => Math.random() - 0.5);
            if (count && count < queue.length) queue = queue.slice(0, count);
          }
        } else {
          const targetCount = count || 10;
          if (quizMode === "places") {
            queue = buildPlaceQueue(null, targetCount);
          } else {
            const codes = Object.keys(PREFECTURE_DATA).map(Number);
            queue = codes.sort(() => Math.random() - 0.5).slice(0, targetCount);
          }
        }

        // この挑戦がどのカテゴリの記録になるか決める（練習・おすすめは記録しない）
        replayRef.current = replay;
        setIsReplay(replay);
        if (!replay) {
          // 「同じ条件でもう一度遊ぶ」で再現できるように、この挑戦の条件をおぼえておく
          let placeCat = null;
          const placeRebuild = quizMode === "places" && !regionKey && !!customQueue && !skipCatRef.current && queue.length > 0;
          if (placeRebuild) {
            const cats = new Set(queue.map(id => PLACES[id - PLACE_ID_BASE].category));
            const only = cats.size === 1 ? Array.from(cats)[0] : null;
            const sizeOfCat = only ? new Set(PLACES.filter(p => p.category === only).map(p => p.name)).size : 0;
            placeCat = only && queue.length === sizeOfCat ? only : null;
          }
          lastStartRef.current = { difficulty, regionKey, count, practiceMode, recommended: skipCatRef.current, placeRebuild, placeCat };
        }
        if (!replay) lastQueueRef.current = [...queue];
        let catKey = null;
        if (!practiceMode && !skipCatRef.current && !replay && queue.length > 0) {
          if (quizMode === "places") {
            if (regionKey) {
              catKey = "places:region:" + regionKey;
            } else {
              const cats = new Set(queue.map(id => PLACES[id - PLACE_ID_BASE].category));
              const only = cats.size === 1 ? Array.from(cats)[0] : null;
              const sizeOfCat = only ? new Set(PLACES.filter(p => p.category === only).map(p => p.name)).size : 0;
              catKey = only && queue.length === sizeOfCat ? "places:" + only : "places:all";
            }
          } else if (regionKey && ACTIVE_MAP_SET === "tokyo") {
            catKey = "tokyo:" + regionKey + ":" + queue.length; // 東京都は問題数ごとに記録
          } else if (regionKey) {
            catKey = ACTIVE_MAP_SET + ":" + regionKey;
          } else {
            catKey = ACTIVE_MAP_SET + ":all" + queue.length;
          }
        }
        skipCatRef.current = false;
        catKeyRef.current = catKey;
        maxComboRef.current = 0;

        setQuizQueue(queue.slice(1));
        const firstCode = queue[0];
        setCurrentTarget(getQuizItem(firstCode));
        setCurrentChoices(firstCode >= PLACE_ID_BASE ? generatePlaceChoices(firstCode) : generateChoices(firstCode));
        setMaxQuestions(queue.length);
        setTotalQuestions(0);
        setScore(0);
        scoreRef.current = 0;
        setCombo(0);
        setMaxCombo(0);
        setCorrectAnswers(0);
        correctAnswersRef.current = 0;
        setQuizFeedback(null);
        setTimeLeft(30);
        setUserInputValue("");
        quizStartTimeRef.current = Date.now();
        setQuizActive(true);
      };

      const handleAnswerSelection = (selectedPrefCode) => {
        if (!quizActive || quizFeedback || !currentTarget) return;

        const isPlaces = !!currentTarget.isPlace;
        const selectedNum = parseInt(selectedPrefCode, 10);
        const isCorrect = isPlaces
          ? selectedNum === currentTarget.id
          : selectedNum === parseInt(currentTarget.code, 10);
        if (!isPlaces) updatePrefStats(currentTarget.code, isCorrect);

        // 効果音を再生
        playQuizSound(isCorrect);

        if (isCorrect) {
          const newCombo = combo + 1;
          const pointsGained = isPractice ? 10 : 10 + (newCombo > 1 ? (newCombo - 1) * 5 : 0);
          const newScore = score + pointsGained;
          const newCorrect = correctAnswers + 1;

          setCombo(newCombo);
          if (newCombo > maxCombo) setMaxCombo(newCombo);
          if (newCombo > maxComboRef.current) maxComboRef.current = newCombo;
          setScore(newScore);
          scoreRef.current = newScore;
          setCorrectAnswers(newCorrect);
          correctAnswersRef.current = newCorrect;
          setQuizFeedback({ correct: true, message: `素晴らしい！ +${pointsGained}pt (${newCombo}コンボ)` });
        } else {
          setCombo(0);
          if (isPlaces) {
            setQuizFeedback({ correct: false, message: `残念！正解は「${currentTarget.name}」です。` });
          } else {
            setQuizFeedback({ correct: false, message: `残念！正解は「${currentTarget.name}」です。` });
          }
        }

        const nextTotal = totalQuestions + 1;
        setTotalQuestions(nextTotal);

        setTimeout(() => {
          if (nextTotal >= maxQuestions) {
            endQuiz(true);
          } else {
            handleNextQuestion(quizQueue, score, combo, correctAnswers);
          }
        }, isCorrect ? 1000 : 2000);
      };

      const handlePrefectureClick = (code) => {
        if (!quizActive) {
          setSelectedCode(parseInt(code, 10));
          return;
        }
        if (quizMode === "touch") {
          handleAnswerSelection(code);
        }
      };

      const handleChoiceButtonClick = (choiceCode) => {
        if (quizMode === "choices" || quizMode === "specialties" || quizMode === "capital" || quizMode === "places") {
          handleAnswerSelection(choiceCode);
        }
      };

      const handleInputSubmit = () => {
        if (!quizActive || quizFeedback || !currentTarget) return;
        const isCorrect = checkCapitalAnswer(userInputValue, currentTarget);
        handleAnswerSelection(isCorrect ? currentTarget.code : -1);
      };

      const handleInputChange = (val) => {
        setUserInputValue(val);
      };

      const handleRoulette = () => {
        if (isRouletteActive) return;
        setIsRouletteActive(true);
        setFinalSelectedKey(null);

        const keys = Object.keys(REGION_GROUPS).filter(k => !REGION_GROUPS[k].hidden);
        let counter = 0;
        const interval = setInterval(() => {
          setRouletteKey(keys[counter % keys.length]);
          counter++;
        }, 120);

        setTimeout(() => {
          clearInterval(interval);
          const chosenKey = keys[Math.floor(Math.random() * keys.length)];
          setRouletteKey(chosenKey);
          setFinalSelectedKey(chosenKey);
          setIsRouletteActive(false);

          setTimeout(() => {
            setRouletteKey(null);
            startQuiz("easy", chosenKey, null, null, false);
          }, 1000);
        }, 2200);
      };

      // 「同じ条件でもう一度遊ぶ」：直前の挑戦と同じ条件（モード・地方・問題数・項目・練習など）で始める
      const retryQuiz = () => {
        const L = lastStartRef.current;
        if (!L) { startQuiz(quizDifficulty, selectedRegionKey, maxQuestions, quizQueue.length ? quizQueue : null); return; }
        if (L.recommended) { startRecommendedQuiz(); return; }
        if (L.placeRebuild) {
          const q = buildPlaceQueue(null, null, L.placeCat);
          startQuiz(L.difficulty, null, q.length, q, L.practiceMode);
          return;
        }
        startQuiz(L.difficulty, L.regionKey, L.count, null, L.practiceMode);
      };

      const startRecommendedQuiz = () => {
        setQuizRecommendedActive(true);
        skipCatRef.current = true;

        if (quizMode === "places") {
          // 場所クイズ：これまで苦手だった（または未挑戦の）都道府県にある場所を優先して10問
          const rank = (place) => {
            let r = 2;
            place.prefs.forEach(c => {
              const st = prefStats[c] || { asked: 0, correct: 0 };
              if (st.asked === 0) r = Math.min(r, 1);
              else if (st.correct / st.asked < 0.8) r = Math.min(r, 0);
            });
            return r + Math.random() * 0.9;
          };
          const seen = new Set();
          const placeQueue = PLACES.map((p, i) => ({ i, r: rank(p) }))
            .sort((a, b) => a.r - b.r)
            .filter(x => { if (seen.has(PLACES[x.i].name)) return false; seen.add(PLACES[x.i].name); return true; })
            .slice(0, 10)
            .map(x => PLACE_ID_BASE + x.i)
            .sort((a, b) => PLACE_CATEGORIES.indexOf(PLACES[a - PLACE_ID_BASE].category) - PLACE_CATEGORIES.indexOf(PLACES[b - PLACE_ID_BASE].category));
          startQuiz("easy", null, 10, placeQueue, false);
          return;
        }

        const allCodes = Object.keys(PREFECTURE_DATA).map(Number);
        
        const lowAccuracyList = [];
        const unattemptedList = [];
        const otherList = [];

        allCodes.forEach(code => {
          const stat = prefStats[code] || { asked: 0, correct: 0 };
          if (stat.asked === 0) {
            unattemptedList.push(code);
          } else {
            const accuracy = stat.correct / stat.asked;
            if (accuracy < 0.8) {
              lowAccuracyList.push(code);
            } else {
              otherList.push(code);
            }
          }
        });

        lowAccuracyList.sort(() => Math.random() - 0.5);
        unattemptedList.sort(() => Math.random() - 0.5);
        otherList.sort(() => Math.random() - 0.5);

        const targetQueue = [...lowAccuracyList, ...unattemptedList, ...otherList].slice(0, 10);
        startQuiz("easy", null, 10, targetQueue, false);
      };

      useEffect(() => {
        if (quizActive && !quizFeedback && !quizFinished) {
          timerRef.current = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                clearInterval(timerRef.current);
                handleAnswerSelection(-1);
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        } else {
          if (timerRef.current) clearInterval(timerRef.current);
        }
        return () => { if (timerRef.current) clearInterval(timerRef.current); };
      }, [quizActive, quizFeedback, quizFinished, currentTarget]);

      useEffect(() => {
        if (quizActive && quizMode === "capitalInput" && !quizFeedback && inputRef.current) {
          const focusTimeout = setTimeout(() => {
            if (inputRef.current) {
              inputRef.current.focus();
            }
          }, 50);
          return () => clearTimeout(focusTimeout);
        }
      }, [quizActive, quizMode, currentTarget, quizFeedback]);

      const handleCreateNewGroup = async () => {
        const code = createdCodePreview || generate8CharCode();
        const name = multiNickname.trim() || "プレイヤー";
        safeSetLocalStorage("japan_map_quiz_nickname", name);

        const currentUid = authUser?.uid || auth?.currentUser?.uid || myUserId;
        const dateStr = new Date().toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });

        const newGroupObj = {
          code: code,
          ownerUid: currentUid,
          ownerName: name,
          createdAt: Date.now(),
          settings: { showRanking: false, showLastPlay: false, showScores: false },
          members: {
            [currentUid]: { 
              id: currentUid, 
              nickname: name, 
              isOwner: true, 
              joinedAt: Date.now(),
              totalScore: totalScore,
              bestScore: bestScore,
              lastScore: 0,
              lastPlayedAt: dateStr,
              lastCourse: "未プレイ"
            }
          }
        };

        if (firebaseAvailable && db && currentUid) {
          try {
            const groupRef = db.doc(`artifacts/${appId}/public/data/groups/${code}`);
            const myGroupsRef = db.doc(`artifacts/${appId}/users/${currentUid}/groups/my_groups`);

            const newGroupPayload = {
              code: code,
              ownerUid: currentUid,
              ownerName: name,
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              settings: {
                showRanking: false,
                showLastPlay: false,
                showScores: false
              },
              members: {
                [currentUid]: {
                  id: currentUid,
                  nickname: name,
                  isOwner: true,
                  joinedAt: Date.now(),
                  totalScore: totalScore,
                  bestScore: bestScore,
                  lastScore: 0,
                  lastPlayedAt: dateStr,
                  lastCourse: "未プレイ"
                }
              }
            };

            await groupRef.set(newGroupPayload, { merge: true });

            const myDoc = await myGroupsRef.get().catch(() => null);
            let currentCodes = [];
            if (myDoc && myDoc.exists && myDoc.data().groupCodes) {
              currentCodes = myDoc.data().groupCodes;
            }
            if (!currentCodes.includes(code)) {
              currentCodes.push(code);
            }
            await myGroupsRef.set({ groupCodes: currentCodes }, { merge: true }).catch(() => {});
          } catch (e) {
            console.warn("Firestore permission error on create, using local fallback mode:", e);
          }
        }

        setAllGroupsData(prev => {
          const nextAll = { ...prev, [code]: newGroupObj };
          safeSetLocalStorage("japan_map_quiz_all_groups", JSON.stringify(nextAll));
          return nextAll;
        });

        const nextMy = Array.from(new Set([...myGroupCodes, code]));
        setMyGroupCodes(nextMy);
        safeSetLocalStorage("japan_map_quiz_my_groups", JSON.stringify(nextMy));

        setGroupNoticeMsg(`グループ (${code}) を作成し、所属しました！`);
        setCreatedGroupCodePreview(generate8CharCode());
      };

      const handleJoinGroupSubmit = async (targetCode) => {
        const cleanCode = (targetCode || joinGroupCodeInput).trim().toLowerCase();
        if (!cleanCode) {
          setGroupNoticeMsg("グループコードを入力してください。");
          return;
        }
        const name = multiNickname.trim() || "プレイヤー";
        safeSetLocalStorage("japan_map_quiz_nickname", name);

        const currentUid = authUser?.uid || auth?.currentUser?.uid || myUserId;
        const dateStr = new Date().toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });

        if (firebaseAvailable && db && currentUid) {
          try {
            const groupRef = db.doc(`artifacts/${appId}/public/data/groups/${cleanCode}`);
            const myGroupsRef = db.doc(`artifacts/${appId}/users/${currentUid}/groups/my_groups`);

            const docSnap = await groupRef.get().catch(() => null);
            if (docSnap && docSnap.exists) {
              const updateObj = {};
              updateObj[`members.${currentUid}`] = {
                id: currentUid,
                nickname: name,
                isOwner: docSnap.data().ownerUid === currentUid,
                joinedAt: Date.now(),
                totalScore: totalScore,
                bestScore: bestScore,
                lastScore: 0,
                lastPlayedAt: dateStr,
                lastCourse: "未プレイ"
              };
              await groupRef.update(updateObj);

              const myDoc = await myGroupsRef.get().catch(() => null);
              let currentCodes = [];
              if (myDoc && myDoc.exists && myDoc.data().groupCodes) {
                currentCodes = myDoc.data().groupCodes;
              }
              if (!currentCodes.includes(cleanCode)) {
                currentCodes.push(cleanCode);
              }
              await myGroupsRef.set({ groupCodes: currentCodes }, { merge: true }).catch(() => {});
            }
          } catch (e) {
            console.warn("Firestore permission error on join, using local fallback mode:", e);
          }
        }

        const existingGroup = allGroupsData[cleanCode] || {
          code: cleanCode,
          ownerUid: "",
          ownerName: "不明",
          createdAt: Date.now(),
          settings: { showRanking: false, showLastPlay: false, showScores: false },
          members: {}
        };
        const updatedMembers = {
          ...existingGroup.members,
          [currentUid]: { 
            id: currentUid, 
            nickname: name, 
            isOwner: existingGroup.ownerUid === currentUid, 
            joinedAt: Date.now(),
            totalScore: totalScore,
            bestScore: bestScore,
            lastScore: 0,
            lastPlayedAt: dateStr,
            lastCourse: "未プレイ"
          }
        };
        const updatedGroup = { ...existingGroup, members: updatedMembers };
        setAllGroupsData(prev => {
          const nextAll = { ...prev, [cleanCode]: updatedGroup };
          safeSetLocalStorage("japan_map_quiz_all_groups", JSON.stringify(nextAll));
          return nextAll;
        });

        const nextMy = Array.from(new Set([...myGroupCodes, cleanCode]));
        setMyGroupCodes(nextMy);
        safeSetLocalStorage("japan_map_quiz_my_groups", JSON.stringify(nextMy));

        setGroupNoticeMsg(`グループ (${cleanCode}) に所属しました！`);
        setJoinGroupCodeInput("");
      };

      const handleLeaveGroup = async (code) => {
        const currentUid = authUser?.uid || auth?.currentUser?.uid || myUserId;
        const nextMy = myGroupCodes.filter(c => c !== code);
        setMyGroupCodes(nextMy);
        safeSetLocalStorage("japan_map_quiz_my_groups", JSON.stringify(nextMy));

        if (firebaseAvailable && db && currentUid) {
          try {
            const groupRef = db.doc(`artifacts/${appId}/public/data/groups/${code}`);
            const myGroupsRef = db.doc(`artifacts/${appId}/users/${currentUid}/groups/my_groups`);

            const updateObj = {};
            updateObj[`members.${currentUid}`] = firebase.firestore.FieldValue.delete();
            await groupRef.update(updateObj).catch(() => {});
            await myGroupsRef.set({ groupCodes: nextMy }).catch(() => {});
          } catch (e) {}
        }
        setGroupNoticeMsg(`グループ (${code}) から脱退しました。`);
      };

      useEffect(() => {
        if (!firebaseAvailable || !db) return;
        const currentUid = authUser?.uid || auth?.currentUser?.uid || myUserId;
        if (!currentUid) return;

        const myGroupsRef = db.doc(`artifacts/${appId}/users/${currentUid}/groups/my_groups`);
        const unsubscribeMy = myGroupsRef.onSnapshot(
          doc => {
            if (doc.exists && doc.data().groupCodes) {
              setMyGroupCodes(doc.data().groupCodes);
              safeSetLocalStorage("japan_map_quiz_my_groups", JSON.stringify(doc.data().groupCodes));
            }
          },
          err => {
            console.warn("my_groups snapshot listener notice:", err.message);
          }
        );

        return () => unsubscribeMy();
      }, [authUser, myUserId]);

      useEffect(() => {
        if (!firebaseAvailable || !db || myGroupCodes.length === 0) return;

        const unsubscribers = myGroupCodes.map(code => {
          const groupRef = db.doc(`artifacts/${appId}/public/data/groups/${code}`);
          return groupRef.onSnapshot(
            doc => {
              if (doc.exists) {
                setAllGroupsData(prev => {
                  const nextAll = { ...prev, [code]: doc.data() };
                  safeSetLocalStorage("japan_map_quiz_all_groups", JSON.stringify(nextAll));
                  return nextAll;
                });
              }
            },
            err => {
              console.warn(`Group ${code} snapshot listener notice:`, err.message);
            }
          );
        });

        return () => { unsubscribers.forEach(unsub => unsub && unsub()); };
      }, [myGroupCodes]);

      return (
        <div className="flex flex-col min-h-screen justify-between bg-slate-50">
          <main className="flex-1 max-w-7xl w-full mx-auto px-2 sm:px-4 py-2 sm:py-4 grid grid-cols-1 lg:grid-cols-12 gap-4 items-center justify-center">
            
            {!quizFinished && (
              <section className={`lg:col-span-7 bg-white border border-slate-200 rounded-3xl p-2 sm:p-4 shadow-sm flex flex-col items-stretch ${quizActive ? 'justify-start gap-1' : 'justify-between'} min-h-[420px] sm:min-h-[500px] relative w-full`}>
                
                {quizActive && !quizFinished && (
                  <div className="sticky top-0 bg-white/95 backdrop-blur-md border-b border-slate-100 py-1.5 px-3 -mx-2 sm:-mx-4 mb-1 z-30 w-full flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 transition-all duration-300">
                    <div className="flex-1">
                      <p className="text-[11px] text-rose-500 font-black uppercase tracking-wider mb-0.5 flex items-center gap-1">
                        <span className="w-1.5 h-1.5 rounded-full bg-rose-500 animate-ping"></span>
                        {(() => {
                          if (isPractice) return "🔰 練習モード";
                          if (quizRecommendedActive) return "🔥 おすすめ（弱点克服）モード";
                          if (quizMode === "places") return "地図に描かれた場所の名前は？";

                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 text-center"><p className="text-[10px] text-slate-400 font-bold uppercase"><ruby>連続正解数<rt>れんぞくせいかいすう</rt></ruby></p><span className="text-2xl font-black text-amber-500">{maxCombo} 連続</span></div>
                    {correctAnswers === maxQuestions ? (
                      <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 text-center"><p className="text-[10px] text-slate-400 font-bold uppercase"><ruby>全問正解<rt>ぜんもんせいかい</rt></ruby>タイム</p><span className="text-2xl font-black text-blue-500">{(() => { const sec = elapsedTime / 1000; return sec <= 10 ? `${sec.toFixed(1)}秒` : `${Math.round(sec)}秒`; })()}</span></div>
                    ) : (
                      <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 text-center flex flex-col justify-center bg-slate-100/50"><p className="text-[10px] text-slate-400 font-bold uppercase"><ruby>全問正解<rt>ぜんもんせいかい</rt></ruby>タイム</p><span className="text-xs font-bold text-slate-400 mt-1">（<ruby>全問正解時<rt>ぜんもんせいかいじ</rt></ruby>のみ）</span></div>
                    )}
                  </div>

                  <div className="flex flex-col gap-2 mt-1">
                    {!isMultiMode && mapSet === "tokyo" && lastQueueRef.current.length > 0 && (
                      <button onClick={() => startQuiz(quizDifficulty, selectedRegionKey, maxQuestions, lastQueueRef.current, isPractice, true)} className="w-full bg-amber-500 hover:bg-amber-600 text-white font-extrabold py-3 px-5 rounded-xl transition-all shadow-md text-sm text-center">🔁 <ruby>同<rt>おな</rt></ruby>じ<ruby>問題<rt>もんだい</rt></ruby>にチャレンジ
                        <div className="text-[10px] font-bold opacity-90"><ruby>記録<rt>きろく</rt></ruby>には<ruby>残<rt>のこ</rt></ruby>りません</div>
                      </button>
                    )}
                    {isReplay && <p className="text-[11px] font-bold text-amber-600 text-center">※この<ruby>挑戦<rt>ちょうせん</rt></ruby>は<ruby>記録<rt>きろく</rt></ruby>に<ruby>残<rt>のこ</rt></ruby>っていません</p>}
                    {!isMultiMode && (
                      <button onClick={retryQuiz} className="w-full bg-rose-500 hover:bg-rose-600 text-white font-extrabold py-3 px-5 rounded-xl transition-all shadow-md text-sm text-center">🔄 <ruby>同<rt>おな</rt></ruby>じ<ruby>条件<rt>じょうけん</rt></ruby>でもう<ruby>一度遊<rt>いちどあそ</rt></ruby>ぶ</button>
                    )}
                    <button onClick={() => { setQuizFinished(false); setSelectedRegionKey(null); }} className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-extrabold py-3 px-5 rounded-xl transition-all text-sm text-center border border-slate-200">🏠 ホームに戻る</button>
                  </div>
                </div>
              )}

            </aside>
          </main>
        </div>
      );
    }

    // スプレッドシートの読み込みが終わってからゲーム本体を表示する
    function Root() {
      const [status, setStatus] = useState("loading");
      const [errorMessage, setErrorMessage] = useState("");
      const [dataSource, setDataSource] = useState("sheet");

      const load = () => {
        setStatus("loading");
        loadPrefectureDataFromSheet()
          .then(src => { setDataSource(src); setStatus("ready"); })
          .catch(err => { setErrorMessage(err && err.message ? err.message : String(err)); setStatus("error"); });
      };

      useEffect(() => { load(); }, []);

      if (status === "loading") {
        return (
          <div className="flex-1 flex flex-col items-center justify-center gap-3 p-6 text-center">
            <div className="text-5xl animate-bounce">🗾</div>
            <p className="text-base font-black text-slate-700">スプレッドシートから<ruby>都道府県<rt>とどうふけん</rt></ruby>データを<ruby>読<rt>よ</rt></ruby>み<ruby>込<rt>こ</rt></ruby>み<ruby>中<rt>ちゅう</rt></ruby>…</p>
          </div>
        );
      }

      if (status === "error") {
        return (
          <div className="flex-1 flex flex-col items-center justify-center gap-3 p-6 text-center">
            <div className="text-5xl">⚠️</div>
            <p className="text-base font-black text-slate-700">「{SHEET_TAB_NAME}」タブのデータを読み込めませんでした。</p>
            <p className="text-xs text-slate-500 max-w-md">{errorMessage}</p>
            <p className="text-xs text-slate-500 max-w-md">スプレッドシートの共有設定が「リンクを知っている全員が閲覧可」になっているか、インターネットにつながっているかを確認してください。</p>
            <button onClick={load} className="bg-rose-500 hover:bg-rose-600 text-white font-extrabold py-2.5 px-6 rounded-xl shadow-md text-sm">🔄 もう一度読み込む</button>
          </div>
        );
      }

      return (
        <React.Fragment>
          {dataSource === "cache" && (
            <div className="bg-amber-50 border-b border-amber-200 text-amber-700 text-[11px] font-bold text-center py-1 px-2">
              スプレッドシートに接続できなかったため、前回読み込んだデータを使っています。
            </div>
          )}
          <App />
        </React.Fragment>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Root />);
  </script>
</body>
</html>
